<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How It Works — Luchifer</title>
<meta name="description" content="A clear custom uniform workflow from requirement and development to production and delivery.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
:root{--black:#090909;--panel:#151513;--cream:#f3efe6;--muted:#918e86;--gold:#c6a66d;--line:rgba(243,239,230,.13);--serif:"Playfair Display",Georgia,serif;--sans:"DM Sans",Arial,sans-serif;--max:1600px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--black);color:var(--cream);font-family:var(--sans);line-height:1.6;padding-top:78px}
a{text-decoration:none;color:inherit}
img{display:block;width:100%}
.container{width:min(var(--max),calc(100% - 48px));margin:0 auto}
.section{padding:115px 0}
.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.23em;font-weight:700;color:#d4b67b;margin-bottom:19px}
.site-loader{position:fixed;inset:0;z-index:99999;background:#0d0d0d;display:flex;align-items:center;justify-content:center;transition:opacity .5s ease,visibility .5s ease}
.site-loader.hidden,.site-loader.is-hidden{opacity:0;visibility:hidden;pointer-events:none}
.site-loader-inner{text-align:center;color:#fff}
.site-loader-logo{font-family:var(--serif);font-size:34px;letter-spacing:.14em;margin-bottom:16px}
.site-loader-logo span{color:var(--gold)}
.site-loader-line{width:180px;height:1px;margin:0 auto 14px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.site-loader-text{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#a8a29a}
.site-header{position:fixed;top:0;left:0;right:0;z-index:1000;height:78px;background:rgba(9,9,9,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(243,239,230,.08)}
.site-nav{height:100%;max-width:var(--max);margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.site-logo{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:.09em;color:#fff;text-decoration:none;flex-shrink:0}
.site-logo span{color:var(--gold)}
.site-links{display:flex;align-items:center;gap:26px;color:#fff;font-size:13px;font-weight:600}
.site-links a{color:#fff;text-decoration:none;opacity:.88;transition:.25s;white-space:nowrap}
.site-links a:hover{color:#d5bd87;opacity:1}
.site-links .site-cta{border:1px solid var(--gold);padding:10px 16px;opacity:1;white-space:nowrap}
.site-links .site-cta:hover{background:var(--gold);color:#0a0a09}
.site-menu{display:none;width:44px;height:44px;padding:8px;border:0;background:transparent;cursor:pointer;flex-direction:column;justify-content:center;gap:5px}
.site-menu span{display:block;width:24px;height:2px;margin-left:auto;background:#fff;transition:.25s}
.site-menu.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.site-menu.open span:nth-child(2){opacity:0}
.site-menu.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.site-mobile-menu{display:none;position:absolute;top:78px;left:0;right:0;z-index:1001;background:rgba(9,9,9,.98);border-top:1px solid rgba(243,239,230,.1);box-shadow:0 18px 35px rgba(0,0,0,.4);padding:8px 15px 16px}
.site-mobile-menu.open{display:block}
.site-mobile-menu a{display:flex;align-items:center;justify-content:space-between;padding:16px 4px;color:#fff;text-decoration:none;border-bottom:1px solid rgba(243,239,230,.1);font-size:14px;font-weight:600}
.site-mobile-menu a span{color:var(--gold)}
.site-mobile-menu .site-mobile-cta{margin-top:8px;padding:14px 16px;background:var(--gold);border:0;color:#0a0a09;justify-content:center;border-bottom:0;font-weight:700}
.info-head{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:end;margin-bottom:55px}
.info-head h2{font-family:var(--serif);font-size:clamp(38px,4.6vw,64px);font-weight:500;line-height:1.02;letter-spacing:-.04em;margin:0}
.info-head h2 em{font-style:normal;color:var(--gold)}
.info-head p{color:var(--muted);font-size:14px;line-height:1.9;margin:0}
.process{margin-top:45px;display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.step{background:var(--panel);color:var(--cream);padding:34px 30px;min-height:250px;transition:.3s;display:flex;flex-direction:column}
.step:hover{background:#1a1a18}
.step small{color:var(--gold);font-size:10px;letter-spacing:.16em;font-weight:700}
.step h3{font-family:var(--serif);font-size:25px;font-weight:500;margin:22px 0 12px;color:var(--cream);line-height:1.15}
.step p{color:var(--muted);font-size:13px;line-height:1.75;margin:0}
.info-band{padding:115px 0;background:#10100f;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.info-band .info-head{margin-bottom:45px}
.info-band .info-head p{color:#c7c3bb}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.info-card{background:#10100f;padding:32px 30px;min-height:210px;transition:.3s}
.info-card:hover{background:#1a1a18}
.info-card small{font-size:10px;color:var(--gold);letter-spacing:.14em;font-weight:700}
.info-card h3{font-family:var(--serif);font-size:23px;font-weight:500;margin-top:18px;line-height:1.2;color:var(--cream)}
.info-card p{color:var(--muted);font-size:13px;line-height:1.75;margin-top:10px}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .75s ease,transform .75s ease}
.reveal.show{opacity:1;transform:none}
.site-footer{background:#0b0b0b;color:#fff;border-top:1px solid rgba(243,239,230,.1)}
.site-footer-inner{width:min(var(--max),calc(100% - 48px));margin:0 auto}
.site-footer-topline{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:22px 0;border-bottom:1px solid rgba(243,239,230,.1);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#8c8880}
.site-footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1.3fr;
